id: agents-generation-runtime
owner: Agents
description: FastAPI routes, v2 scenario generation, result analysis, and legacy generation adapters.
paths:
  - Agents/README.md
  - Agents/app/api/**
  - Agents/app/core/**
  - Agents/app/models/**
  - Agents/app/agents/common/**
  - Agents/app/agents/scenario_generation_v2/**
  - Agents/app/agents/result_analysis_v2/**
  - Agents/app/services/*generation*
  - Agents/app/services/*world_config*
  - Agents/app/services/*episode*
  - Agents/app/services/*run_queue*
  - Agents/docs/api/**
  - Agents/docs/providers/**
  - Agents/docs/environment/**
  - Client/Json/environment-catalog.md
  - contracts/specs/user-project-data.md
entry:
  - id: api-and-models
    description: Public routes, settings, and payload models.
    read:
      - Agents/app/api/routes.py
      - Agents/app/core
      - Agents/app/models
  - id: scenario-generation-v2
    description: Active project-scenario generation graph, prompt context, prop normalization, and optional preset patch/fallback flow.
    read:
      - Agents/app/agents/common/spec_context_loader.py
      - Agents/app/agents/scenario_generation_v2
  - id: result-analysis-v2
    description: Run analysis, recommendation response, and review artifacts.
    read:
      - Agents/app/agents/result_analysis_v2
  - id: legacy-generation
    description: Legacy generation services retained for compatibility/tooling.
    read:
      - Agents/app/services/world_config_generation_orchestrator.py
      - Agents/app/services/run_queue_export_service.py
      - Agents/app/services/world_config_to_episode_setup_adapter.py
      - Agents/app/services/world_config_to_delivery_bot_setup_adapter.py
guardrails:
  - Active public scenario generation is v2 project scenario output, not legacy RunQueue export.
  - Scenario generation v2 may read bundled scenario presets as skeletons, but must deepcopy, patch user intent, validate, repair/revalidate, and fallback without changing the external scenario JSON response schema.
  - Scenario generation v2 preset patching and fallback generation must both use the same `ScenarioIntent` fields for corridor profile, length, obstacle count, requested prop, and no-obstacle/no-pedestrian policy.
  - Scenario generation v2 fallback output must be generated from `ScenarioIntent` values such as corridor profile, requested length, obstacle count, prop id, and no-obstacle/no-pedestrian flags without requiring static scenario preset files.
  - Scenario generation v2 normalizes known legacy static obstacle prop ids through the shared prop normalizer before validator-gated preset, repair, or LLM output can become an API response.
  - Scenario generation v2 repair diagnostics are internal only: detailed `repair_events` may be stored on graph/agent state for debugging, while `/api/v2/scenarios/generate` continues to return only the project scenario body.
  - Legacy WorldConfig tooling must call only the provider explicitly selected by the caller; Ollama remains a direct local/manual provider, not an automatic retry target.
  - Final user project contracts write project/run/episode artifacts under `contracts/specs/user-project-data.md`.
  - V2 LLM prompt context is loaded only through the SpecContextLoader allowlist.
  - V2 LLM prompt context reads the Client environment catalog at Client/Json/environment-catalog.md for scenario vocabulary and static obstacle bounding boxes.
  - `/api/v2/analysis/run` always executes `ResultAnalysisGraphRunnerV2`; do not add runtime settings that switch it to another analysis path.
  - Result analysis reads `prompts/system_prompt.md` only on the LLM-enabled path; `V2_AGENT_LLM_ENABLED=true` from `Agents/.env` or process env can enable that path during local runs.
  - `Settings(_env_file=None)` is for checking code fallback defaults without reading `.env`; do not treat it as the local runtime value when `Agents/.env` is present.
  - Review artifacts are stored under `<UserProject>/runs/<RunId>/review/<ReviewId>/`.
  - Result analysis public responses expose display fields only; keep detailed recommendation ids, proposed changes, and modified candidate payloads in `recommendations.json`.
  - Result analysis LLM recommendations must pass public text guardrails; internal RAG/source markers never belong in public summary, insight, reason, or recommendation text.
  - Recommendation output uses the public `recommendation` field; normalize legacy internal names before API/artifact output.
  - UI-facing finding/evidence text may be Korean; stable metric/type codes remain English.
verify:
  - when: route, model, or service payloads change
    run:
      - focused pytest for touched route/model/service
      - contract validation for changed public fields
  - when: v2 scenario preset selection, patching, validation, or fallback changes
    run:
      - cd Agents; uv run pytest tests/test_v2_scenario_generation_api.py -q
  - when: v2 scenario repair behavior or repair diagnostics change
    run:
      - cd Agents; uv run pytest tests/test_scenario_quality_repairer.py -q
      - cd Agents; uv run pytest tests/test_v2_scenario_generation_api.py -q
  - when: v2 analysis or recommendation artifacts change
    run:
      - cd Agents; uv run pytest tests/test_v2_analysis_run_api.py tests/test_v2_result_analysis_graph_runner.py tests/test_v2_analysis_recommendation_artifacts.py -q
      - pytest covering review lifecycle, parsing, text, and recommendation artifacts when those surfaces change
  - when: LLM prompt context changes
    run:
      - focused v2 spec-context prompt tests
      - cd Agents; uv run pytest tests/test_result_analysis_system_prompt.py -q
  - when: LLM provider settings or legacy WorldConfig provider behavior changes
    run:
      - cd Agents; uv run pytest tests/test_llm_provider_policy.py -q
      - cd Agents; uv run pytest tests/test_world_config_generation_orchestrator.py -q
links:
  - Agents/README.md
  - Agents/docs/api/V2_AGENT_APIS.md
  - Client/Json/environment-catalog.md
  - contracts/specs/user-project-data.md
related:
  - agents-policy-rag-data
  - contracts-shared-data
  - client-simulation
