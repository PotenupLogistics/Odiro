id: agents-tooling-harness
owner: Agents
description: Agents scripts, harness, pytest
paths:
  - Agents/harness/**
  - Agents/scripts/**
  - Agents/tools/**
  - Agents/tests/**
  - Agents/docs/tooling/**
  - Agents/task-setup.bat
  - Agents/task-run.bat
  - Agents/task-dev.bat
entry:
  - id: primary
    description: Primary files and entry points for this area.
    read:
      - Agents/harness/checks
      - Agents/scripts
      - Agents/tests
      - Agents/task-setup.bat
      - Agents/task-run.bat
      - Agents/task-dev.bat
      - Agents/tools/check-prerequisites.ps1
      - Agents/tools/install.ps1
      - Agents/tools/run.ps1
      - Agents/tools/dev.ps1
guardrails:
  - Agents/tools use Agents/tools/common.ps1, never root tools/common.ps1.
  - Agents has no build task; it is a Python server.
  - Agents/tools/install.ps1 uses uv sync --check before uv sync so repeated setup calls are cheap when the environment is already synchronized, while still printing completion.
verify:
  - when: agents-tooling-harness changes
    run:
      - focused pytest for touched test surface
      - harness.checks.check_all only for broad Agents readiness changes
      - CLI help/smoke for script changes
related:
  - root-dev-workflow
  - agents-generation-runtime
