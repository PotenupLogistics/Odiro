id: agents-tooling-harness
owner: Agents
description: Agents-local tools, tests, and harness checks.
paths:
  - Agents/harness/**
  - Agents/scripts/**
  - Agents/tools/**
  - Agents/tests/**
  - Agents/docs/tooling/**
  - Agents/pyproject.toml
  - Agents/uv.lock
entry:
  - id: primary
    description: Agents tools, harness, and tests.
    read:
      - Agents/tools
      - Agents/harness
      - Agents/tests
      - Agents/pyproject.toml
guardrails:
  - Agents tools use `Agents/tools/common.ps1`, never root `tools/common.ps1`.
  - Agents is a Python server; do not add a root build expectation for it.
  - Root `task-setup.bat`, `task-run.bat`, and `task-dev.bat` are the user-facing Agents task entrypoints.
  - Setup should keep repeated `uv sync` calls cheap when the environment is already synchronized.
  - Harness checks stay Agents-local unless promoted to root CI intentionally.
verify:
  - when: Agents scripts, tools, or tests change
    run:
      - focused pytest for touched test surface
      - CLI help or smoke for changed scripts
      - harness.checks.check_all for broad Agents readiness changes
related:
  - root-dev-workflow
  - agents-generation-runtime
