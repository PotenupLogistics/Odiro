id: bridge-host
owner: Bridge
description: Go host process, local IPC, workspace files, and simulator process lifecycle.
paths:
  - Bridge/**
  - static/templates/**
  - static/run-defaults/**
  - contracts/specs/bridge-ipc.md
entry:
  - id: host
    description: Bridge executable, IPC protocol, workspace service, and process manager.
    read:
      - Bridge/README.md
      - Bridge/cmd/odirohost/main.go
      - Bridge/internal/api
      - Bridge/internal/ipc
      - Bridge/internal/process
      - Bridge/internal/protocol
      - Bridge/internal/workspace
  - id: resources-and-tools
    description: Project scaffolds and Bridge-local tooling.
    read:
      - static/templates
      - static/run-defaults
      - Bridge/tools
      - Bridge/task-setup.bat
      - Bridge/task-build.bat
      - Bridge/task-run.bat
guardrails:
  - Bridge exposes local portless IPC; adding HTTP ports requires a contract update.
  - IPC transport is selected by Go build tags: Windows named pipe or Unix domain socket.
  - Shared observable IPC messages belong in `contracts/specs/bridge-ipc.md`.
  - static/templates and static/run-defaults are the user-project creation and run scaffold sources.
  - Workspace validation rejects generated caches and source-only placeholders where runtime copies should not include them.
  - Process manager owns simulator child launch, status JSON lifecycle, cancellation, and completion state.
  - Bridge tools use `Bridge/tools/common.ps1`, never root `tools/common.ps1`.
verify:
  - when: Bridge Go code changes
    run:
      - cd Bridge; go test ./...
  - when: Bridge scripts or packaging flow changes
    run:
      - PowerShell parse check for touched Bridge tools
      - Bridge/tools/build.ps1
links:
  - Bridge/README.md
  - contracts/specs/bridge-ipc.md
  - contracts/specs/user-project-data.md
related:
  - root-dev-workflow
  - contracts-shared-data
  - client-platform-execution
