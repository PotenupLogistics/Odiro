id: client-runtime-foundation
owner: Client
description: Unreal project config, module boundaries, maps, assets, and UMG asset ownership.
paths:
  - Client/AGENTS.md
  - Client/OdiroSim.uproject
  - Client/Source/*.Target.cs
  - Client/Source/OdiroSim/OdiroSim.Build.cs
  - Client/Source/OdiroSim/Public/UI/Base*.h
  - Client/Source/OdiroSim/Private/UI/Base*.cpp
  - Client/Config/**
  - Client/Content/**
  - Client/Plugins/UEGitPlugin/**
entry:
  - id: project-config
    description: Unreal project, targets, modules, and config.
    read:
      - Client/AGENTS.md
      - Client/OdiroSim.uproject
      - Client/Source/OdiroSim.Target.cs
      - Client/Source/OdiroSimEditor.Target.cs
      - Client/Source/OdiroSim/OdiroSim.Build.cs
      - Client/Config
  - id: assets
    description: Maps, UI assets, catalog data assets, and source-control plugin config.
    read:
      - Client/Content/Maps
      - Client/Content/Widgets
      - Client/Content/Data
      - Client/Plugins/UEGitPlugin
  - id: base-widgets
    description: Independent base widget token types, component view adapters, and WBP assets.
    read:
      - Client/Source/OdiroSim/Public/UI
      - Client/Source/OdiroSim/Private/UI
      - Client/Content/Widgets/Common
guardrails:
  - Unreal-specific config and assets stay in Client.
  - Add module dependencies only at the public/private boundary that needs them.
  - Default startup uses StartupMap for project selection; ScenarioEditorMap owns the editor workspace.
  - UMG assets own layout/style and required BindWidget names; C++ should not reconstruct asset trees as fallback UI.
  - Base widget assets are independent common component surfaces; do not wire them into existing screens during foundation work.
  - Scenario editor widget class references are catalog-owned through Client Content data assets.
  - UEGitPlugin is for editor checkout/lock flow; do not add `filter=lfs` attributes from the plugin UI.
verify:
  - when: Unreal module or config changes
    run:
      - smallest affected Unreal target build
      - source control provider loads as Git LFS 2 when source-control config changes
  - when: UMG assets or BindWidget contracts change
    run:
      - UmgMcp widget tree readback for touched assets
      - Blueprint compile/save for touched maps/widgets/data assets
      - UmgMcp get_layout_data and check_widget_overlap for user-facing UMG layout/style mutations
      - relevant PIE or runtime log check
related:
  - client-platform-execution
  - client-simulation
