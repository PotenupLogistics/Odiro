id: client-simulation
owner: Client
description: Scenario authoring/runtime, episode execution, evaluation, and run output artifacts.
paths:
  - Client/Source/OdiroSim/Public/Scenario/**
  - Client/Source/OdiroSim/Private/Scenario/**
  - Client/Source/OdiroSim/Public/Episode/**
  - Client/Source/OdiroSim/Private/Episode/**
  - Client/Source/OdiroSim/Public/Shared/**
  - Client/Source/OdiroSim/Private/Shared/**
  - Client/Json/**
  - Client/Docs/plans/PLAN-260602-sim-logging.md
  - contracts/specs/user-project-data.md
  - docs/specs/simulation-interface.md
entry:
  - id: contracts-and-shared-types
    description: Scenario, sample, user-project, and run-output data shapes.
    read:
      - contracts/specs/user-project-data.md
      - docs/specs/simulation-interface.md
      - Client/Json
      - Client/Source/OdiroSim/Public/Shared
      - Client/Source/OdiroSim/Private/Shared
  - id: scenario-authoring
    description: Scenario editor, authoring controller, UI ViewModels, outliner/sidebar widgets, and LLM authoring.
    read:
      - Client/Source/OdiroSim/Public/Scenario/ScenarioEditorUiSubsystem.h
      - Client/Source/OdiroSim/Private/Scenario/ScenarioEditorUiSubsystem.cpp
      - Client/Source/OdiroSim/Public/Scenario/ViewModel
      - Client/Source/OdiroSim/Private/Scenario/ViewModel
      - Client/Source/OdiroSim/Public/Scenario/Editor
      - Client/Source/OdiroSim/Private/Scenario/Editor
      - Client/Source/OdiroSim/Public/Scenario/Widget
      - Client/Source/OdiroSim/Private/Scenario/Widget
      - Client/Source/OdiroSim/Public/Scenario/Llm
      - Client/Source/OdiroSim/Private/Scenario/Llm
  - id: scenario-runtime
    description: Scenario sampling, world-spec adaptation, simulation, evaluation, runner lifecycle, and episode logs.
    read:
      - Client/Source/OdiroSim/Public/Scenario
      - Client/Source/OdiroSim/Private/Scenario
      - Client/Source/OdiroSim/Public/Episode
      - Client/Source/OdiroSim/Private/Episode
guardrails:
  - Final user project input uses one editable `<UserProject>/scenario.json`; generated episode scenarios are derived run artifacts.
  - Public project-run execution accepts direct scenario/profile inputs, not legacy RunQueue start helpers.
  - Client/Json prompt-facing schemas and catalogs must stay aligned with shared user-project contracts.
  - ScenarioDocument and ScenarioSample surfaces remain internal editor/materialization shapes unless the task targets them.
  - ScenarioSimulationSubsystem owns runtime grid rebuild after scenario surfaces spawn.
  - ScenarioRunnerSubsystem owns project episode lifecycle, policy start/end coordination, cancellation, late callbacks, and cleanup.
  - User project run output is written through typed UserProjectData JSON writers.
  - ScenarioEditorUiSubsystem owns ScenarioEditorMap UI ViewModel lifecycle and stores no widget pointers.
  - Scenario editor selection, subsystem lookup, and world mutation stay controller/subsystem/component-owned; ViewModels expose FieldNotify state and command facades through ScenarioEditorUiSubsystem.
  - Scenario editor reusable WBP class references come from ScenarioEditorWidgetClassCatalog assets or exposed widget properties; do not add C++ WBP class-path fallbacks.
  - Scenario LLM prompt widgets read input and forward commands only; prompt ViewModel owns generation/load/run command state, while scenario path validation, generation delegate binding, editor load/save, and project run launch stay behind ScenarioEditorUiSubsystem.
  - Scenario Template sidebar repeated rows use ScenarioTemplateFieldRowViewModel items; native widgets only bind rows, inject item state, and forward edit events.
  - Shared corridor/geometry helpers own reusable surface metadata, spline mesh helpers, and analytic surface queries.
verify:
  - when: scenario contracts, schemas, or samples change
    run:
      - contract specs versus Client/Json sample/schema alignment
      - scenario document/sample parse and round-trip automation tests
  - when: scenario authoring or editor UI changes
    run:
      - focused ScenarioEditor model/selection tests
      - OdiroSim.ScenarioEditor.ViewModel automation tests
      - UmgMcp and Blueprint verification for touched editor widgets
  - when: runtime, adapter, runner, evaluation, or output changes
    run:
      - focused Scenario/Episode automation tests
      - adapter, run-output, event, action, trace, and lifecycle tests covering touched behavior
links:
  - contracts/specs/user-project-data.md
  - docs/specs/simulation-interface.md
  - Client/Docs/plans/PLAN-260602-sim-logging.md
  - Client/Json/environment-catalog.md
related:
