guardrails:
  - Final user project input uses one editable `<UserProject>/scenario.json`; generated episode scenarios are derived run artifacts.
  - Public project-run execution accepts direct scenario/profile inputs, not legacy RunQueue start helpers.
  - Client/Json prompt-facing schemas and catalogs must stay aligned with shared user-project contracts.
  - ScenarioDocument and ScenarioSample surfaces remain internal editor/materialization shapes unless the task targets them.
  - ScenarioSimulationSubsystem owns runtime grid rebuild after scenario surfaces spawn.
  - ScenarioRunnerSubsystem owns project episode lifecycle, policy start/end coordination, cancellation, late callbacks, and cleanup.
  - User project run output is written through typed UserProjectData JSON writers.
  - ScenarioEditorUiSubsystem owns ScenarioEditorMap UI ViewModel lifecycle and stores no widget pointers.
  - Scenario editor selection, subsystem lookup, and world mutation stay controller/subsystem/component-owned; ViewModels expose FieldNotify state and command facades through ScenarioEditorUiSubsystem.
  - Scenario editor viewport navigation input is owned by ScenarioEditorController with Enhanced Input assets under Client/Content/Input; keep mouse capture, selection, and cancel bindings explicit.
  - ScenarioEditorLaunchSubsystem owns ScenarioEditorMap travel gating for editor visual asset preload before the viewport becomes visible.
  - ScenarioEditorPawn owns camera-level viewport presentation defaults such as the grey background post-process blendable.
  - Scenario editor robot Start/Goal markers use authoring-subsystem proxy actors for selection and root-widget screen-space overlay paint for visible markers.
  - Scenario Object Palette commands must be backed by scenario.json authoring contracts; currently it creates only fixed static-obstacle rows in obstacles.placements.
  - ScenarioEditorShellViewModel owns editor UI selection commands for template panel/block and placeable selection; viewport and outliner placeable selection focus and scroll to the matching sidebar block, and sidebar placeable-backed blocks route reverse selection through Shell commands instead of composing selection state locally.
  - Scenario editor reusable WBP class references come from ScenarioEditorWidgetClassCatalog assets or exposed widget properties; do not add C++ WBP class-path fallbacks.
  - Scenario LLM prompt widgets read input and forward commands only; prompt ViewModel owns generation/load/run command state, while scenario path validation, generation delegate binding, editor load/save, and project run launch stay behind ScenarioEditorUiSubsystem.
  - Scenario Template sidebar repeated rows use ScenarioTemplateFieldRowViewModel items; native widgets only bind rows, inject item state, and forward edit events.
  - Scenario Template sidebar helper code owns only repeated block/field-row visual setup and no-argument add/remove action wiring; data mutation stays in ScenarioTemplateSidebarViewModel commands.
  - Shared corridor/geometry helpers own reusable surface metadata, procedural lane mesh helpers, and analytic surface queries.
  - Scenario editor authoring UI hides legacy GroundRegion draw/outliner affordances; Corridor surfaces are the editable ground source, while runtime GroundRegion compatibility remains in simulation/evaluation.
  - Scenario preview framing consumes Scenario-owned bounds resolving and does not inspect DeliveryBot grid actors directly.
  - Scenario save preview uses surface-only bounds with ScenarioPreviewFitScale.
  - ScenarioPreviewCaptureSubsystem owns transient SceneCapture2D, render-target cleanup, alpha normalization, and episode warmup lifecycle for top-view orthographic FinalColorLDR PNG capture.
  - ScenarioEditorMap and ScenarioSimulationMap keep matching directional-light intensity and rotation; preview capture avoids temporary lighting and pixel-level RGB correction for episode thumbnails.
  - ScenarioEditorController requests the project preview only after scenario.json saves successfully; capture failure removes stale preview.png without changing the save result.
  - ScenarioRunnerSubsystem schedules project episode preview.png after evaluation starts; capture failure must not change episode outcome.
verify:
  - when: scenario contracts, schemas, or samples change
    run:
      - contract specs versus Client/Json sample/schema alignment
      - scenario document/sample parse and round-trip automation tests
  - when: scenario authoring or editor UI changes
    run:
      - focused ScenarioEditor model/selection tests
      - OdiroSim.ScenarioEditor.ViewModel automation tests
      - UmgMcp and Blueprint verification for touched editor widgets
  - when: runtime, adapter, runner, evaluation, or output changes
    run:
      - focused Scenario/Episode automation tests
      - adapter, run-output, event, action, trace, and lifecycle tests covering touched behavior
  - when: scenario preview capture changes
    run:
      - focused map-bounds and preview-framing automation tests
      - OdiroSimEditor build
