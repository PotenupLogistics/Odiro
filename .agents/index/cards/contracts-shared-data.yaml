id: contracts-shared-data
owner: Root
description: Shared specs, schemas, examples, static templates, and product structure docs.
paths:
  - contracts/**
  - docs/specs/**
  - static/templates/**
  - static/run-defaults/**
  - Client/Docs/JSON_Guide/**
  - Client/Docs/specs/**
entry:
  - id: shared-contracts
    description: Shared payload, file, API, and IPC contracts.
    read:
      - contracts/specs
      - contracts/schemas
  - id: product-structure
    description: Repository/product structure and shared runtime resource layout.
    read:
      - docs/specs
      - static/templates
      - static/run-defaults
  - id: legacy-client-docs
    description: Legacy Client JSON/interface references that must not become new shared contracts.
    read:
      - Client/Docs/JSON_Guide
      - Client/Docs/specs
guardrails:
  - "`contracts/specs` is the human-readable truth for shared payload/API/file formats."
  - "`contracts/schemas` contains machine-readable validation for shared contracts."
  - User project files, run artifacts, presets, and run defaults belong in `contracts/specs/user-project-data.md`.
  - Bridge IPC method compatibility belongs in `contracts/specs/bridge-ipc.md`.
  - "`docs/specs` is for repository/product structure, rules, and requirements, not wire contracts."
  - Client/Docs JSON guides are legacy Client references; do not define new shared file contracts there.
  - RunQueue and DeliveryBotSetup specs are legacy guides unless an explicit migration restores them.
  - static/templates and static/run-defaults must stay aligned with the shared user-project contract.
verify:
  - when: shared contracts or templates change
    run:
      - consuming project schema or fixture validation
      - contract specs versus generated examples/templates review
      - compatibility tests when two components consume the same payload
links:
  - contracts/specs/user-project-data.md
  - contracts/specs/bridge-ipc.md
  - docs/specs/project-structure.md
  - docs/specs/project-rules.md
  - docs/specs/simulation-interface.md
related:
  - bridge-host
  - client-simulation
  - client-delivery-bot-policy
  - agents-generation-runtime
