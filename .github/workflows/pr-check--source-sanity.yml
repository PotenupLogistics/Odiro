name: Sanity Check

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  source-code-sanity:
    name: Source code
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          lfs: false

      - name: Stage PR changes
        id: stage
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $parentLine = (git rev-list --parents -n 1 HEAD).Trim()
          $parents = @($parentLine -split " " | Select-Object -Skip 1)
          if ($parents.Count -lt 2) {
              throw "Expected a pull_request merge commit with at least two parents; found $($parents.Count)."
          }

          git reset --soft $parents[0]
          git diff --cached --name-status

          $bridgeChanged = @(
              git diff --cached --name-only --diff-filter=ACMRT -- |
                  Where-Object { $_ -match "^Bridge/.*\.go$" -or $_ -eq "Bridge/go.mod" -or $_ -eq "Bridge/go.sum" }
          )
          $hasBridgeChanges = if ($bridgeChanged.Count -gt 0) { "true" } else { "false" }
          "bridge_changed=$hasBridgeChanges" >> $env:GITHUB_OUTPUT

      - name: Setup Go
        if: steps.stage.outputs.bridge_changed == 'true'
        uses: actions/setup-go@v5
        with:
          go-version-file: Bridge/go.mod
          cache: false

      - name: Run source code sanity check
        shell: pwsh
        run: ./tools/check-source-sanity.ps1 -Hook pr-check -Force
