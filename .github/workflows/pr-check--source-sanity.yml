name: Sanity Check

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  source-code-sanity:
    name: Source code
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: Bridge/go.mod
          cache: false

      - name: Stage PR changes
        shell: pwsh
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          $ErrorActionPreference = "Stop"
          git fetch --no-tags origin "+refs/heads/$env:BASE_REF`:refs/remotes/origin/$env:BASE_REF"
          $mergeBase = (git merge-base "refs/remotes/origin/$env:BASE_REF" HEAD).Trim()
          if ([string]::IsNullOrWhiteSpace($mergeBase)) {
              throw "Failed to find merge-base for origin/$env:BASE_REF and HEAD."
          }
          git reset --soft $mergeBase
          git diff --cached --name-status

      - name: Run source code sanity check
        shell: pwsh
        run: ./tools/check-source-sanity.ps1 -Hook pr-check -Force
