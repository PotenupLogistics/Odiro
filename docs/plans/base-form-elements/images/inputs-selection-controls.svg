<svg viewBox="0 0 1180 1230" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Freesentation','Pretendard','Segoe UI',system-ui,sans-serif">
<title>Odiro inputs and selection controls spec</title>
<desc>Spec with consistent number-range field sizing, project caret icons at half size, and parent-child indeterminate checkboxes.</desc>
<rect width="1180" height="1230" fill="#1A1A1A"/>
