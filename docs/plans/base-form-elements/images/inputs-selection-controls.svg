<text x="40" y="70" fill="#A8A8A8" font-size="12">States, types and variants · Split Base DA · accent #0070E0 · radius 4px · caret = T_Icon_Caret</text>
<rect x="40" y="86" width="1100" height="1" fill="#333333"/>

