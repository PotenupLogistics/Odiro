<svg viewBox="0 0 1180 1200" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Freesentation','Pretendard','Segoe UI',system-ui,sans-serif">
<title>Odiro data surfaces and overlays spec</title>
<desc>Thumbnail card with uniform 10px padding (full-bleed default, inset optional), tree rows with caret icons and inline sublabel, tooltip whose bottom-left corner sits on the cursor tip, and pointer-anchored context menu.</desc>
<rect width="1180" height="1200" fill="#1A1A1A"/>
<text x="40" y="46" fill="#FFFFFF" font-size="24" font-weight="700">Spec — Data surfaces &amp; overlays</text>
<text x="40" y="70" fill="#A8A8A8" font-size="12">Container card · customizable tree rows · light cursor tooltip · context menu</text>
<rect x="40" y="86" width="1100" height="1" fill="#333333"/>

<g transform="translate(40,110)">
  <text x="0" y="0" fill="#F2F2F2" font-size="14" font-weight="700">Thumbnail card</text>
  <text x="118" y="0" fill="#7A7A7A" font-size="11">4:3 media + single content slot · uniform 10px padding · media: full-bleed (default) / inset (optional)</text>
  <rect x="0" y="8" width="1100" height="1" fill="#262626"/>

  <rect x="0" y="24" width="250" height="262" rx="4" fill="#242424" stroke="#3A3A3A"/>
  <rect x="0" y="24" width="250" height="188" rx="4" fill="#0F0F0F" stroke="#3A3A3A"/>
  <text x="125" y="122" fill="#5E5E5E" font-size="11" text-anchor="middle">4:3 media · edge-to-edge</text>
  <rect x="10" y="222" width="230" height="54" rx="3" fill="none" stroke="#5E5E5E" stroke-dasharray="3 3"/>
  <text x="125" y="246" fill="#7A7A7A" font-size="11" text-anchor="middle">content slot</text>
  <text x="125" y="262" fill="#7A7A7A" font-size="9" text-anchor="middle">title · subtitle · status…</text>
  <text x="0" y="304" fill="#4CAF50" font-size="10">Full-bleed — default</text>

  <rect x="282" y="24" width="250" height="262" rx="4" fill="#242424" stroke="#3A3A3A"/>
  <rect x="292" y="34" width="230" height="173" rx="3" fill="#0F0F0F" stroke="#3A3A3A"/>
  <text x="407" y="124" fill="#5E5E5E" font-size="11" text-anchor="middle">4:3 media · inset 10px</text>
  <rect x="292" y="217" width="230" height="59" rx="3" fill="none" stroke="#5E5E5E" stroke-dasharray="3 3"/>
  <text x="407" y="243" fill="#7A7A7A" font-size="11" text-anchor="middle">content slot</text>
  <text x="407" y="259" fill="#7A7A7A" font-size="9" text-anchor="middle">title · subtitle · status…</text>
  <text x="282" y="304" fill="#7A7A7A" font-size="10">Inset — optional</text>

  <rect x="564" y="24" width="250" height="262" rx="4" fill="#242424" stroke="#3A3A3A"/>
  <rect x="564" y="24" width="250" height="188" rx="4" fill="#0F0F0F" stroke="#3A3A3A"/>
  <text x="689" y="124" fill="#3A3A3A" font-size="22" text-anchor="middle">▦</text>
  <text x="574" y="240" fill="#FFFFFF" font-size="13" font-weight="700">Recent project</text>
  <text x="574" y="258" fill="#A8A8A8" font-size="11">Downtown smoke test</text>
  <text x="564" y="304" fill="#7A7A7A" font-size="10">Basic slot</text>

  <rect x="846" y="24" width="250" height="262" rx="4" fill="#242424" stroke="#0070E0"/>
  <rect x="846" y="24" width="250" height="188" rx="4" fill="#0F0F0F" stroke="#3A3A3A"/>
  <text x="971" y="124" fill="#3A3A3A" font-size="22" text-anchor="middle">▦</text>
  <text x="856" y="238" fill="#FFFFFF" font-size="13" font-weight="700">Episode result</text>
  <text x="856" y="256" fill="#A8A8A8" font-size="11">Preset B · run 18</text>
  <circle cx="860" cy="270" r="3.5" fill="#4CAF50"/>
  <text x="872" y="274" fill="#4CAF50" font-size="11">Success</text>
  <text x="1086" y="274" fill="#A8A8A8" font-size="11" text-anchor="end">04:38</text>
  <text x="846" y="304" fill="#7A7A7A" font-size="10">Rich slot · selected</text>
</g>

<g transform="translate(40,452)">
  <text x="0" y="0" fill="#F2F2F2" font-size="14" font-weight="700">Tree view</text>
  <text x="70" y="0" fill="#7A7A7A" font-size="11">single-line row: expander (caret) · icon · label + inline sublabel · right label</text>
  <rect x="0" y="8" width="1100" height="1" fill="#262626"/>

  <rect x="0" y="24" width="1100" height="40" rx="4" fill="#1A1A1A" stroke="#3A3A3A"/>
  <path d="M13 40 L17 44 L13 48" stroke="#A8A8A8" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="34" y="36" width="16" height="16" rx="3" fill="#383838" stroke="#4A4A4A"/>
  <circle cx="42" cy="44" r="3.5" fill="#2589F5"/>
  <text x="62" y="49" fill="#FFFFFF" font-size="13" font-weight="700">Label</text>
  <text x="112" y="49" fill="#7A7A7A" font-size="11">Sublabel</text>
  <text x="1086" y="49" fill="#A8A8A8" font-size="12" text-anchor="end">Right label</text>
  <text x="10" y="80" fill="#7A7A7A" font-size="9">expander</text>
  <text x="34" y="80" fill="#7A7A7A" font-size="9">icon</text>
  <text x="62" y="80" fill="#7A7A7A" font-size="9">label + inline sublabel</text>
  <text x="1086" y="80" fill="#7A7A7A" font-size="9" text-anchor="end">right-aligned label</text>

  <rect x="0" y="96" width="620" height="190" rx="4" fill="#151515" stroke="#3A3A3A"/>
  <path d="M15 110 L19 114 L23 110" stroke="#A8A8A8" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="34" y="107" width="16" height="16" rx="3" fill="#383838" stroke="#4A4A4A"/>
  <text x="40" y="119" fill="#8C8C8C" font-size="11" text-anchor="middle">▤</text>
  <text x="60" y="120" fill="#CFCFCF" font-size="13">Scenario</text>
  <text x="604" y="120" fill="#7A7A7A" font-size="11" text-anchor="end">root</text>

  <rect x="4" y="132" width="612" height="30" fill="#242424"/>
  <rect x="4" y="132" width="3" height="30" fill="#0070E0"/>
  <path d="M35 145 L39 149 L43 145" stroke="#A8A8A8" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="54" y="139" width="16" height="16" rx="3" fill="#383838" stroke="#4A4A4A"/>
  <circle cx="62" cy="147" r="3.5" fill="#5E5E5E"/>
  <text x="80" y="152" fill="#FFFFFF" font-size="13" font-weight="700">Intersection_A</text>
  <text x="188" y="152" fill="#7A7A7A" font-size="11">junction</text>
  <text x="604" y="152" fill="#7A7A7A" font-size="11" text-anchor="end">selected</text>

  <rect x="72" y="166" width="16" height="16" rx="3" fill="#383838" stroke="#4A4A4A"/>
  <circle cx="80" cy="174" r="3.5" fill="#4A9FF5"/>
  <text x="98" y="179" fill="#CFCFCF" font-size="13">EgoVehicle</text>
  <text x="180" y="179" fill="#7A7A7A" font-size="11">dynamic</text>
  <text x="604" y="179" fill="#7A7A7A" font-size="11" text-anchor="end">62 km/h</text>

  <rect x="72" y="196" width="16" height="16" rx="3" fill="#383838" stroke="#4A4A4A"/>
  <circle cx="80" cy="204" r="3.5" fill="#E0A030"/>
  <text x="98" y="209" fill="#CFCFCF" font-size="13">Pedestrian_03</text>
  <text x="190" y="209" fill="#7A7A7A" font-size="11">walking</text>
  <text x="604" y="209" fill="#E0A030" font-size="11" text-anchor="end">warning</text>

  <rect x="72" y="226" width="16" height="16" rx="3" fill="#383838" stroke="#4A4A4A"/>
  <circle cx="80" cy="234" r="3.5" fill="#4CAF50"/>
  <text x="98" y="239" fill="#CFCFCF" font-size="13">TrafficLight_N</text>
  <text x="194" y="239" fill="#7A7A7A" font-size="11">signal</text>
  <text x="604" y="239" fill="#7A7A7A" font-size="11" text-anchor="end">green</text>

  <path d="M37 257 L41 261 L37 265" stroke="#A8A8A8" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="54" y="253" width="16" height="16" rx="3" fill="#383838" stroke="#4A4A4A"/>
  <text x="60" y="265" fill="#8C8C8C" font-size="11" text-anchor="middle">▤</text>
  <text x="80" y="266" fill="#CFCFCF" font-size="13">Camera_Rig</text>
  <text x="604" y="266" fill="#7A7A7A" font-size="11" text-anchor="end">collapsed</text>

  <text x="660" y="120" fill="#A8A8A8" font-size="11" font-weight="700">Row slots</text>
  <text x="660" y="142" fill="#7A7A7A" font-size="11">· Expander — caret icon, auto when node has children</text>
  <text x="660" y="160" fill="#7A7A7A" font-size="11">· Icon — texture or glyph + tint</text>
  <text x="660" y="178" fill="#7A7A7A" font-size="11">· Label + sublabel — inline, one line</text>
  <text x="660" y="196" fill="#7A7A7A" font-size="11">· Right label — value / status, right-aligned</text>
  <text x="660" y="222" fill="#7A7A7A" font-size="11">Each slot is optional; row is data-driven</text>
  <text x="660" y="240" fill="#7A7A7A" font-size="11">by a generic item view model.</text>
</g>

<g transform="translate(40,770)">
  <text x="0" y="0" fill="#F2F2F2" font-size="14" font-weight="700">Tooltip</text>
  <text x="55" y="0" fill="#7A7A7A" font-size="11">light surface · dark text · bottom-left corner sits on the cursor tip</text>
  <rect x="0" y="8" width="1100" height="1" fill="#262626"/>
  <rect x="0" y="80" width="120" height="32" rx="4" fill="#383838" stroke="#5E5E5E"/>
  <text x="60" y="100" fill="#F2F2F2" font-size="13" text-anchor="middle">Run check</text>
  <rect x="110" y="80" width="262" height="30" rx="4" fill="#FFFFFF" stroke="#C8C8C8"/>
  <text x="122" y="100" fill="#1A1A1A" font-size="12">Run validation on the current preset</text>
  <path d="M110 110 L110 132 L116 126 L120 134 L124 132 L119 124 L127 124 Z" fill="#F2F2F2" stroke="#1A1A1A" stroke-width="0.6"/>
  <text x="400" y="96" fill="#7A7A7A" font-size="11">The tooltip's bottom-left corner is pinned to the pointer tip,</text>
  <text x="400" y="114" fill="#7A7A7A" font-size="11">so it grows up-and-right; flips automatically near edges.</text>
</g>

<g transform="translate(40,905)">
  <text x="0" y="0" fill="#F2F2F2" font-size="14" font-weight="700">Context menu</text>
  <text x="95" y="0" fill="#7A7A7A" font-size="11">opens at the pointer · WBP slot container for arbitrary items / submenus</text>
  <rect x="0" y="8" width="1100" height="1" fill="#262626"/>
  <rect x="0" y="36" width="360" height="48" rx="4" fill="#242424" stroke="#3A3A3A"/>
  <text x="14" y="58" fill="#FFFFFF" font-size="13" font-weight="700">Scenario row</text>
  <text x="14" y="76" fill="#A8A8A8" font-size="11">Right-click for actions</text>
  <rect x="150" y="60" width="180" height="186" rx="4" fill="#151515" stroke="#5E5E5E"/>
  <text x="164" y="84" fill="#CFCFCF" font-size="13">Open</text>
  <rect x="154" y="96" width="172" height="30" fill="#2F2F2F"/>
  <text x="164" y="116" fill="#FFFFFF" font-size="13">Duplicate</text>
  <text x="316" y="116" fill="#7A7A7A" font-size="11" text-anchor="end">Ctrl+D</text>
  <text x="164" y="148" fill="#CFCFCF" font-size="13">Rename</text>
  <text x="164" y="180" fill="#CFCFCF" font-size="13">Move to</text>
  <path d="M314 176 L318 180 L314 184" stroke="#A8A8A8" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="164" y="196" width="148" height="1" fill="#333333"/>
  <text x="164" y="222" fill="#E5534B" font-size="13">Delete</text>
  <text x="316" y="222" fill="#7A7A7A" font-size="11" text-anchor="end">Del</text>
  <path d="M150 60 L150 84 L156 78 L160 86 L164 84 L159 76 L167 76 Z" fill="#F2F2F2" stroke="#1A1A1A" stroke-width="0.6"/>
  <text x="420" y="84" fill="#7A7A7A" font-size="11">Menu's top-left spawns at the click position;</text>
  <text x="420" y="102" fill="#7A7A7A" font-size="11">overlapping the pointer is fine since it stays</text>
  <text x="420" y="120" fill="#7A7A7A" font-size="11">open until the next click. Host any items or</text>
  <text x="420" y="138" fill="#7A7A7A" font-size="11">nested submenus as child widgets.</text>
</g>

<rect x="40" y="1166" width="1100" height="1" fill="#262626"/>
<text x="40" y="1188" fill="#7A7A7A" font-size="10">Mockup only — native widget + WBP implementation starts after approval.</text>
<text x="1140" y="1188" fill="#5E5E5E" font-size="10" text-anchor="end">Split Base DA · Freesentation · 2 of 2</text>
</svg>
