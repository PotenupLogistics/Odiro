<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Odiro UI Mockups</title>
  <style>
    @font-face {
      font-family: "Freesentation";
      src:
        url("fonts/Freesentation-4Regular.woff2") format("woff2"),
        local("Freesentation 4 Regular"),
        local("Freesentation-4Regular"),
        local("Freesentation");
      font-weight: 400;
      font-style: normal;
    }

    @font-face {
      font-family: "Freesentation";
      src:
        url("fonts/Freesentation-5Medium.woff2") format("woff2"),
        local("Freesentation 5 Medium"),
        local("Freesentation-5Medium"),
        local("Freesentation Medium");
      font-weight: 500;
      font-style: normal;
    }

    @font-face {
      font-family: "Freesentation";
      src:
        url("fonts/Freesentation-6SemiBold.woff2") format("woff2"),
        local("Freesentation 6 SemiBold"),
        local("Freesentation-6SemiBold"),
        local("Freesentation SemiBold");
      font-weight: 600;
      font-style: normal;
    }

    @font-face {
      font-family: "Freesentation";
      src:
        url("fonts/Freesentation-7Bold.woff2") format("woff2"),
        local("Freesentation 7 Bold"),
        local("Freesentation-7Bold"),
        local("Freesentation Bold");
      font-weight: 700;
      font-style: normal;
    }

    :root {
      --bg: #1a1a1a;
      --chrome: #151515;
      --panel: #242424;
      --panel-2: #1b1b1b;
      --well: #0f0f0f;
      --border: #3a3a3a;
      --border-hover: #5e5e5e;
      --text: #cfcfcf;
      --text-strong: #f1f1f1;
      --muted: #a8a8a8;
      --label: #8c8c8c;
      --faint: #5e5e5e;
      --accent: #0070e0;
      --accent-hover: #2589f5;
      --accent-active: #0059c2;
      --success: #4caf50;
      --warn: #e0a030;
      --danger: #e5534b;
      --info: #4a9ff5;
      --violet: #8a7cf6;
      --cyan: #39b8c8;
      --radius: 4px;
      --font-title: 17.5px;
      --font-label: 15px;
      --font-body: 16px;
      --font-caption: 14px;
      --font-value: 35px;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      background: #070707;
      color: var(--text);
      font-family: "Freesentation", "Segoe UI Variable", "Segoe UI", Arial, sans-serif;
      font-size: var(--font-body);
      letter-spacing: 0;
    }

    body {
      display: grid;
      place-items: center;
    }

    .frame {
      width: 1600px;
      height: 900px;
      overflow: hidden;
      position: relative;
      background: var(--bg);
      border: 1px solid #262626;
    }

    .app {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      background: var(--bg);
    }

    .titlebar {
      height: 34px;
      flex: 0 0 34px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 0 0 10px;
      background: #111111;
      border-bottom: 1px solid #2a2a2a;
      color: var(--muted);
      font-size: var(--font-caption);
    }

    .title-left,
    .title-right,
    .row,
    .toolbar,
    .tabs,
    .status-row,
    .field-row,
    .control-row,
    .metric-row,
    .timeline,
    .table-row {
      display: flex;
      align-items: center;
    }

    .window-dots {
      display: flex;
      gap: 7px;
    }

    .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #3c3c3c;
      border: 1px solid #555;
    }

    .window-icon {
      width: 16px;
      height: 16px;
      object-fit: contain;
    }

    .window-title {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      color: var(--muted);
      font-size: var(--font-caption);
      font-weight: 600;
    }

    .window-controls {
      margin-left: auto;
      display: flex;
      height: 100%;
    }

    .window-control {
      width: 46px;
      height: 100%;
      position: relative;
      display: grid;
      place-items: center;
      color: var(--label);
      font-size: 0;
    }

    .window-control.close:hover {
      background: var(--danger);
      color: #fff;
    }

    .window-control::before,
    .window-control::after {
      content: "";
      position: absolute;
      background: currentColor;
    }

    .window-control.min::before {
      width: 12px;
      height: 1px;
    }

    .window-control.max::before {
      width: 11px;
      height: 11px;
      background: transparent;
      border: 1px solid currentColor;
    }

    .window-control.close::before,
    .window-control.close::after {
      width: 13px;
      height: 1px;
      background: currentColor;
    }

    .window-control.close::before { transform: rotate(45deg); }
    .window-control.close::after { transform: rotate(-45deg); }

    .content {
      flex: 1;
      min-height: 0;
      display: flex;
    }

    .topbar {
      height: 58px;
      flex: 0 0 58px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      background: var(--chrome);
      border-bottom: 1px solid #2d2d2d;
    }

    .statusbar {
      height: 58px;
      flex: 0 0 58px;
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 0 16px;
      background: var(--chrome);
      border-bottom: 0;
    }

    .statusbar .brand {
      flex: 0 0 auto;
      min-width: 0;
    }

    .status-logo {
      width: 28px;
      height: 28px;
      object-fit: contain;
    }

    .statusbar-title {
      color: var(--text-strong);
      font-size: var(--font-title);
      font-weight: 700;
      white-space: nowrap;
    }

    .statusbar-subtitle {
      margin-top: 1px;
      color: var(--label);
      font-size: var(--font-caption);
      white-space: nowrap;
    }

    .status-tabs {
      height: 100%;
      display: flex;
      align-items: flex-end;
      gap: 2px;
      min-width: 0;
      overflow: hidden;
    }

    .status-tab {
      height: 40px;
      min-width: 132px;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 12px;
      color: var(--muted);
      background: #202020;
      border: 1px solid #303030;
      border-bottom: 0;
      border-radius: 4px 4px 0 0;
      font-size: var(--font-label);
      font-weight: 600;
      white-space: nowrap;
    }

    .status-tab.active {
      color: var(--text-strong);
      background: var(--panel);
      border-color: #454545;
      position: relative;
      z-index: 2;
    }

    .status-tab.active::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: -1px;
      height: 1px;
      background: var(--panel);
    }

    .tab-close {
      width: 18px;
      height: 18px;
      margin-left: auto;
      display: inline-grid;
      place-items: center;
      border-radius: 3px;
      opacity: .72;
    }

    .tab-close .ui-icon {
      width: 12px;
      height: 12px;
    }

    .status-tab-swatch {
      width: 4px;
      height: 18px;
      border-radius: 1px;
      background: var(--tab-color, var(--accent));
    }

    .ui-icon {
      width: 18px;
      height: 18px;
      object-fit: contain;
      flex: 0 0 auto;
    }

    .status-tab .ui-icon {
      width: 17px;
      height: 17px;
      opacity: .9;
    }

    .statusbar-actions {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 0 0 auto;
    }

    .statusbar .window-controls {
      margin-left: 8px;
      flex: 0 0 auto;
    }

    .statusbar .window-control {
      width: 42px;
      height: 58px;
    }

    .project-tabbar {
      height: 45px;
      flex: 0 0 45px;
      display: flex;
      align-items: flex-end;
      gap: 2px;
      padding: 0 16px;
      background: #151515;
      border-bottom: 1px solid #303030;
    }

    .project-tab {
      height: 37px;
      min-width: 138px;
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 0 14px;
      color: var(--muted);
      background: #202020;
      border: 1px solid #303030;
      border-bottom: 0;
      border-radius: 4px 4px 0 0;
      font-size: var(--font-label);
      font-weight: 500;
    }

    .project-tab.active {
      color: var(--text-strong);
      background: #242424;
      border-color: #3a3a3a;
    }

    .project-tab-swatch {
      width: 4px;
      height: 18px;
      border-radius: 1px;
      background: var(--tab-color, var(--accent));
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .mark {
      width: 30px;
      height: 30px;
      position: relative;
      border: 1px solid #4f4f4f;
      background: #101010;
      border-radius: var(--radius);
    }

    .mark::before,
    .mark::after {
      content: "";
      position: absolute;
      inset: 7px;
      border: 2px solid var(--accent);
      transform: rotate(45deg);
    }

    .mark::after {
      inset: 11px;
      border-color: var(--success);
    }

    .brand-title {
      color: var(--text-strong);
      font-size: var(--font-title);
      font-weight: 700;
      white-space: nowrap;
    }

    .brand-subtitle {
      margin-top: 2px;
      color: var(--label);
      font-size: var(--font-caption);
    }

    .rail {
      width: 68px;
      flex: 0 0 68px;
      background: #121212;
      border-right: 1px solid #2d2d2d;
      padding: 14px 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .rail-button,
    .icon-button {
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      background: #1d1d1d;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--muted);
      font-size: 16px;
    }

    .rail-button.active,
    .icon-button.active {
      color: #fff;
      border-color: var(--accent);
      box-shadow: inset 3px 0 0 var(--accent);
      background: #202020;
    }

    .page {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
    }

    .workspace {
      flex: 1;
      min-height: 0;
      display: grid;
      gap: 16px;
      padding: 16px;
      background: var(--panel);
    }

    .workspace.tight {
      gap: 10px;
      padding: 10px;
    }

    .panel {
      min-width: 0;
      min-height: 0;
      background: rgba(36,36,36,.97);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }

    .workspace > .panel {
      border-color: transparent;
      border-radius: 0;
    }

    .panel.well {
      background: var(--well);
    }

    .panel-head {
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 0 14px;
      border-bottom: 1px solid #303030;
      background: #202020;
    }

    .panel-title {
      color: var(--text-strong);
      font-size: var(--font-title);
      font-weight: 700;
      white-space: nowrap;
    }

    .panel-title .ui-icon {
      vertical-align: -3px;
      margin-right: 6px;
    }

    .panel-subtitle {
      color: var(--label);
      font-size: var(--font-caption);
      white-space: nowrap;
    }

    .panel-body {
      padding: 14px;
    }

    .stack {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .grid-3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .btn {
      height: 38px;
      min-width: 38px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 0 14px;
      color: var(--text);
      background: #2a2a2a;
      border: 1px solid var(--border-hover);
      border-radius: var(--radius);
      font-family: inherit;
      font-size: var(--font-body);
      white-space: nowrap;
    }

    .btn.small {
      height: 30px;
      padding: 0 10px;
      font-size: var(--font-caption);
    }

    .btn.primary {
      color: white;
      background: var(--accent);
      border-color: var(--accent-hover);
    }

    .btn.ghost {
      background: transparent;
      border-color: var(--border);
      color: var(--muted);
    }

    .btn.danger {
      color: white;
      background: #3a2020;
      border-color: var(--danger);
    }

    .btn.success {
      color: white;
      background: #1f3a22;
      border-color: var(--success);
    }

    .icon-action {
      width: 38px;
      height: 38px;
      display: inline-grid;
      place-items: center;
      padding: 0;
    }

    .icon-action .ui-icon {
      width: 20px;
      height: 20px;
    }

    .field,
    .select,
    .number-field,
    .textarea {
      width: 100%;
      min-height: 29px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 0 10px;
      background: var(--well);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-size: var(--font-body);
    }

    .field.focused {
      border-color: var(--accent);
      box-shadow: inset 0 0 0 1px rgba(0,112,224,.35);
    }

    .textarea {
      min-height: 82px;
      align-items: flex-start;
      padding-top: 8px;
      line-height: 1.45;
    }

    .label {
      color: var(--label);
      font-size: var(--font-label);
    }

    .value {
      color: var(--text);
      font-size: var(--font-body);
    }

    .muted {
      color: var(--label);
    }

    .strong {
      color: var(--text-strong);
      font-weight: 700;
    }

    .field-row {
      gap: 10px;
      justify-content: space-between;
    }

    .field-col {
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-width: 0;
    }

    .field-col.grow {
      flex: 1;
    }

    .switcher {
      height: 34px;
      display: flex;
      background: var(--well);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }

    .segment {
      min-width: 82px;
      display: grid;
      place-items: center;
      padding: 0 12px;
      color: var(--muted);
      border-right: 1px solid #2d2d2d;
      font-size: var(--font-caption);
    }

    .segment:last-child {
      border-right: 0;
    }

    .segment.active {
      color: white;
      background: var(--accent);
    }

    .slider {
      height: 4px;
      position: relative;
      background: #383838;
      border-radius: 2px;
    }

    .slider .fill {
      position: absolute;
      left: 0;
      top: 0;
      height: 4px;
      background: var(--accent);
      border-radius: 2px;
    }

    .slider .handle {
      position: absolute;
      top: -8px;
      width: 4px;
      height: 20px;
      background: #f2f2f2;
      border-radius: 2px;
      box-shadow: 0 0 0 1px #777;
    }

    .check,
    .toggle {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--text);
      font-size: var(--font-body);
    }

    .box {
      width: 18px;
      height: 18px;
      display: grid;
      place-items: center;
      border: 1px solid var(--border-hover);
      border-radius: 3px;
      background: var(--well);
      color: white;
      font-size: 11px;
    }

    .box.checked {
      background: var(--accent);
      border-color: var(--accent-hover);
    }

    .pill {
      min-height: 22px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 0 8px;
      color: var(--muted);
      border: 1px solid #454545;
      border-radius: 999px;
      background: #1a1a1a;
      font-size: var(--font-caption);
      white-space: nowrap;
    }

    .pill.active {
      color: #fff;
      border-color: var(--accent);
      background: rgba(0,112,224,.25);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--label);
    }

    .status-dot.success { background: var(--success); }
    .status-dot.warn { background: var(--warn); }
    .status-dot.danger { background: var(--danger); }
    .status-dot.info { background: var(--info); }

    .divider {
      height: 1px;
      background: #333;
      margin: 4px 0;
    }

    .thumbnail {
      min-width: 0;
      background: #212121;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }

    .thumbnail.compact {
      display: flex;
      flex-direction: column;
    }

    .thumbnail.preset {
      min-height: 0;
    }

    .thumbnail.selected {
      border-color: var(--accent);
      box-shadow: inset 0 0 0 1px rgba(0,112,224,.4);
    }

    .thumb-media {
      height: 150px;
      position: relative;
      background:
        linear-gradient(rgba(255,255,255,.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.05) 1px, transparent 1px),
        #101010;
      background-size: 18px 18px;
      border-bottom: 1px solid #303030;
      overflow: hidden;
    }

    .thumb-media.ratio {
      height: auto;
      aspect-ratio: 4 / 3;
    }

    .thumb-media.small {
      height: 92px;
    }

    .thumb-body {
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .preset-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
    }

    .preset-grid.two {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .preset-grid.four {
      grid-template-columns: repeat(4, minmax(0, 1fr));
    }

    .preset-card {
      min-width: 0;
      padding: 0;
      background: #212121;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: inherit;
      font: inherit;
      text-align: left;
      overflow: hidden;
    }

    .preset-card.selected {
      border-color: var(--accent);
      box-shadow: inset 0 0 0 1px rgba(0,112,224,.45);
    }

    .preset-thumb {
      position: relative;
      aspect-ratio: 4 / 3;
      background:
        linear-gradient(rgba(255,255,255,.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.05) 1px, transparent 1px),
        #101010;
      background-size: 18px 18px;
      border-bottom: 1px solid #303030;
      overflow: hidden;
    }

    .preset-body {
      min-height: 68px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 4px;
    }

    .path-field {
      min-width: 0;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .map-path {
      position: absolute;
      left: 28px;
      right: 28px;
      top: 50%;
      height: 4px;
      background: var(--accent);
      transform: rotate(-8deg);
      transform-origin: center;
      border-radius: 3px;
    }

    .map-path::before,
    .map-path::after {
      content: "";
      position: absolute;
      top: -5px;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      border: 2px solid white;
      background: #101010;
    }

    .map-path::before { left: -6px; }
    .map-path::after { right: -6px; background: var(--success); }

    .obstacle {
      position: absolute;
      width: 28px;
      height: 20px;
      background: #58413b;
      border: 1px solid #8a6b5f;
      border-radius: 3px;
    }

    .lane {
      position: absolute;
      background: rgba(76,175,80,.18);
      border: 1px solid rgba(76,175,80,.45);
    }

    .tree {
      display: flex;
      flex-direction: column;
      gap: 2px;
      font-size: var(--font-body);
    }

    .tree-row {
      height: 30px;
      display: grid;
      grid-template-columns: 18px 22px 1fr auto;
      align-items: center;
      gap: 8px;
      padding: 0 8px;
      border-radius: 3px;
      color: var(--muted);
    }

    .tree-row > span {
      min-width: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .tree-row.selected {
      color: var(--text-strong);
      background: #2a2a2a;
      box-shadow: inset 3px 0 0 var(--accent);
    }

    .tree-row.indent-1 { padding-left: 24px; }
    .tree-row.indent-2 { padding-left: 48px; }

    .row-icon {
      width: 18px;
      height: 18px;
      display: grid;
      place-items: center;
      border: 1px solid #444;
      border-radius: 3px;
      background: #323232;
      color: var(--label);
      font-size: 10px;
    }

    .row-icon .ui-icon {
      width: 14px;
      height: 14px;
      opacity: .8;
    }

    .content-drawer {
      margin-top: auto;
      border-top: 1px solid #303030;
      background: #191919;
    }

    .content-drawer-head {
      height: 34px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      color: var(--text-strong);
      font-size: var(--font-label);
      font-weight: 700;
    }

    .asset-grid {

      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 8px;
      padding: 0 12px 12px;
      min-height: 0;

    .asset-tile {
      min-width: 0;
      aspect-ratio: 1 / 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 5px;
      border: 1px solid #333;
      border-radius: var(--radius);
      background: #202020;
      color: var(--muted);
      font: inherit;
      font-size: 11px;
      text-align: center;
      overflow: hidden;
    }

    .asset-tile.selected {
      border-color: var(--accent);
      box-shadow: inset 0 0 0 1px rgba(0,112,224,.35);
    }

    .asset-thumb {
      width: 52px;
      height: 52px;
      object-fit: contain;
    }

    .scenario-sidebar .panel-body {
      flex: 7 1 0;
      min-height: 0;
      overflow: hidden;
    }

    .scenario-sidebar .tree {
      height: 100%;
      overflow: hidden;
    }

    .scenario-sidebar .content-drawer {
      flex: 3 1 0;
      min-height: 0;
      margin-top: 0;
      display: flex;
      flex-direction: column;
    }

    .scenario-sidebar .asset-grid {
      flex: 1;
      align-content: start;
      overflow: hidden;
    }

    .metric {
      min-width: 0;
      padding: 12px;
      background: #1f1f1f;
      border: 1px solid var(--border);
      border-radius: var(--radius);
    }

    .metric.compact {
      padding: 8px 12px;
    }

    .metric.compact .num {
      margin-top: 2px;
      font-size: 24px;
    }

    .metric.compact .delta {
      margin-top: 2px;
    }

    .metric .num {
      margin-top: 6px;
      color: var(--text-strong);
      font-size: var(--font-value);
      font-weight: 700;
    }

    .metric .delta {
      margin-top: 6px;
      color: var(--label);
      font-size: var(--font-caption);
    }

    .table {
      display: flex;
      flex-direction: column;
      border: 1px solid #303030;
      border-radius: var(--radius);
      overflow: hidden;
    }

    .table-row {
      min-height: 36px;
      display: grid;
      grid-template-columns: var(--cols, 1fr 1fr 1fr);
      gap: 12px;
      padding: 0 12px;
      border-bottom: 1px solid #303030;
      font-size: var(--font-body);
    }

    .table-row:last-child {
      border-bottom: 0;
    }

    .table-row.head {
      color: var(--label);
      background: #1a1a1a;
      font-size: var(--font-caption);
    }

    .table-row.selected {
      background: #292929;
      box-shadow: inset 3px 0 0 var(--accent);
    }

    .viewport {
      position: relative;
      min-width: 0;
      min-height: 0;
      background:
        linear-gradient(rgba(255,255,255,.045) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.045) 1px, transparent 1px),
        #101010;
      background-size: 28px 28px;
      overflow: hidden;
    }

    .viewport::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      border: 1px solid rgba(255,255,255,.05);
    }

    .corridor {
      position: absolute;
      left: 16%;
      right: 11%;
      top: 43%;
      height: 132px;
      background: rgba(80,80,80,.35);
      border: 1px solid #555;
      transform: rotate(-11deg);
      box-shadow: inset 0 36px rgba(76,175,80,.12), inset 0 -36px rgba(74,159,245,.10);
    }

    .route {
      position: absolute;
      left: 21%;
      right: 15%;
      top: 49%;
      height: 5px;
      background: var(--accent);
      border-radius: 4px;
      transform: rotate(-11deg);
      box-shadow: 0 0 14px rgba(0,112,224,.35);
    }

    .route::before,
    .route::after {
      content: "";
      position: absolute;
      top: -7px;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      border: 2px solid white;
      background: #111;
    }

    .route::before { left: -8px; }
    .route::after { right: -8px; background: var(--success); }

    .viewport-chip {
      position: absolute;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      height: 24px;
      padding: 0 8px;
      border: 1px solid #444;
      background: rgba(15,15,15,.88);
      color: var(--text);
      border-radius: var(--radius);
      font-size: var(--font-caption);
    }

    .robot {
      position: absolute;
      width: 42px;
      height: 28px;
      background: #d2d2d2;
      border: 2px solid #8c8c8c;
      border-radius: 6px;
      transform: rotate(-11deg);
      box-shadow: 0 0 0 3px rgba(0,112,224,.25);
    }

    .robot::before,
    .robot::after {
      content: "";
      position: absolute;
      top: -7px;
      width: 9px;
      height: 42px;
      border-radius: 6px;
      background: #2c2c2c;
      border: 1px solid #666;
    }

    .robot::before { left: 4px; }
    .robot::after { right: 4px; }

    .side-form {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .form-section {
      padding: 12px;
      border: 1px solid #333;
      background: #202020;
      border-radius: var(--radius);
    }

    .form-section h3 {
      margin: 0 0 10px;
      color: var(--text-strong);
      font-size: var(--font-label);
    }

    .breadcrumb {
      display: flex;
      align-items: center;
      gap: 7px;
      color: var(--label);
      font-size: var(--font-caption);
    }

    .progress-bar {
      height: 6px;
      background: #333;
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-bar span {
      display: block;
      height: 100%;
      width: var(--w, 50%);
      background: var(--accent);
    }

    .splash {
      width: 100%;
      height: 100%;
      position: relative;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 50% 48%, rgba(0,112,224,.14), transparent 34%),
        linear-gradient(rgba(255,255,255,.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.03) 1px, transparent 1px),
        #0e0e0e;
      background-size: auto, 40px 40px, 40px 40px, auto;
    }

    .splash > .titlebar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
    }

    .splash-card {
      width: 520px;
      padding: 38px;
      border: 1px solid #343434;
      background: rgba(21,21,21,.94);
      border-radius: var(--radius);
      box-shadow: 0 20px 80px rgba(0,0,0,.45);
    }

    .startup-blank {
      flex: 1;
      min-height: 0;
      display: grid;
      place-items: center;
      background: #1a1a1a;
    }

    .startup-focus {
      width: 1180px;
      min-height: 720px;
      display: grid;
      grid-template-columns: 380px 1fr;
      border: 1px solid #333333;
      background: #202020;
      border-radius: var(--radius);
      box-shadow: 0 18px 46px rgba(0,0,0,.28);
      overflow: hidden;
    }

    .splash h1 {
      margin: 18px 0 4px;
      color: var(--text-strong);
      font-size: 38px;
      line-height: 1.1;
    }

    .splash .logo-mark {
      width: 74px;
      height: 74px;
      position: relative;
      border: 1px solid #4b4b4b;
      background: #101010;
      border-radius: var(--radius);
    }

    .splash .logo-mark::before,
    .splash .logo-mark::after {
      content: "";
      position: absolute;
      inset: 16px;
      border: 4px solid var(--accent);
      transform: rotate(45deg);
    }

    .splash .logo-mark::after {
      inset: 27px;
      border-color: var(--success);
    }

    .startup-screen {
      flex: 1;
      display: grid;
      grid-template-columns: 42% 58%;
      min-height: 0;
      background: var(--bg);
    }

    .startup-left {
      display: flex;
      align-items: center;
      justify-content: center;
      border-right: 1px solid #303030;
      background: #1a1a1a;
    }

    .startup-identity {
      width: 250px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 20px;
    }

    .startup-logo {
      width: 140px;
      height: 140px;
      image-rendering: auto;
      object-fit: contain;
    }

    .startup-title {
      color: var(--text-strong);
      font-size: 54px;
      line-height: 1;
      font-weight: 700;
    }

    .startup-subtitle {
      color: var(--muted);
      font-size: var(--font-title);
      font-weight: 500;
    }

    .startup-main {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 34px;
    }

    .startup-panel {
      width: 100%;
    }

    .startup-heading {
      height: 38px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: var(--text-strong);
      font-size: var(--font-title);
      font-weight: 700;
      border-bottom: 1px solid var(--line-quiet, #303030);
      margin-bottom: 18px;
    }

    .startup-project-grid {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      padding-bottom: 4px;
    }

    .startup-project-card {
      flex: 0 0 calc((100% - 24px) / 3);
      min-width: 0;
      padding: 0;
      display: block;
      color: inherit;
      font: inherit;
      text-align: left;
      background: transparent;
      border: 0;
    }

    .startup-project-card.selected {
      border-color: var(--accent);
    }

    .startup-project-title {
      color: var(--text-strong);
      font-size: var(--font-body);
      font-weight: 700;
    }

    .startup-project-path {
      color: var(--muted);
      font-size: var(--font-caption);
    }

    .startup-create {
      margin-top: 18px;
      width: 100%;
    }

    .startup-actions {
      display: grid;
      gap: 10px;
      margin-top: 18px;
    }

    .create-layout {
      display: grid;
      grid-template-columns: 1fr 440px;
      gap: 16px;
      min-height: 0;
    }

    .create-main {
      display: flex;
      flex-direction: column;
      gap: 14px;
      min-height: 0;
    }

    .create-section {
      padding: 14px;
      border: 1px solid #333;
      border-radius: var(--radius);
      background: #202020;
    }

    .create-section-head {
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
      color: var(--text-strong);
      font-size: var(--font-label);
      font-weight: 700;
    }

    .create-compact .create-main {
      gap: 10px;
      padding: 12px !important;
      overflow: hidden;
    }

    .create-compact .create-section {
      padding: 10px;
    }

    .create-compact .create-section-head {
      height: 22px;
      margin-bottom: 8px;
    }

    .create-compact .preset-grid {
      gap: 10px;
      grid-template-columns: repeat(3, 176px);
    }

    .create-compact .preset-grid.two {
      grid-template-columns: repeat(2, 176px);
    }

    .create-compact .preset-thumb {
      height: auto;
      aspect-ratio: 4 / 3;
    }

    .create-compact .preset-body {
      min-height: 42px;
      padding: 7px 10px;
    }

    .create-compact .preset-body .strong,
    .create-compact .preset-body .muted {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .create-compact .preset-thumb > .chart {
      height: 100%;
      border: 0;
      border-radius: 0;
    }

    .episode-strip {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding-bottom: 8px;
    }

    .episode-card {
      flex: 0 0 168px;
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: #202020;
      color: inherit;
      font: inherit;
      text-align: left;
    }

    .episode-card.selected {
      border-color: var(--accent);
      box-shadow: inset 3px 0 0 var(--accent);
    }

    .result-detail-layout {
      display: grid;
      grid-template-columns: minmax(0, 3fr) minmax(420px, 2fr);
    }

    .ai-analysis {
      display: flex;
      flex-direction: column;
      gap: 12px;
      line-height: 1.42;
    }

    .ai-section-title {
      color: var(--text-strong);
      font-weight: 700;
    }

    .ai-item {
      display: grid;
      grid-template-columns: 44px 1fr;
      gap: 8px;
      padding: 8px 0;
      border-top: 1px solid #303030;
    }

    .ai-priority {
      color: var(--warn);
      font-weight: 700;
    }

    .result-detail-layout .episode-strip {
      gap: 8px;
      padding-bottom: 2px;
    }

    .result-detail-layout .episode-card {
      flex-basis: 126px;
      padding: 8px;
    }

    .replay-layout {
      display: grid;
      grid-template-columns: 280px 1fr 360px;
      min-height: 0;
    }

    .replay-main {
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 0;
    }

    .replay-main .replay-map {
      min-height: 0;
    }

    .replay-control-panel {
      border-left: 1px solid #303030;
      background: #202020;
      min-height: 0;
      overflow: hidden;
    }

    .replay-control-panel .panel-body {
      padding: 12px;
      gap: 10px;
    }

    .replay-control-panel .form-section {
      padding: 10px 12px;
    }

    .replay-control-panel .form-section h3 {
      margin-bottom: 6px;
    }

    .replay-control-panel .metric.compact {
      padding: 7px 10px;
    }

    .replay-control-panel .metric.compact .num {
      font-size: 22px;
    }

    .replay-control-panel .metric.compact .delta {
      margin-top: 0;
    }

    .ai-panel {
      min-height: 210px;
      line-height: 1.45;
      color: var(--text);
    }

    .result-detail-layout .panel.well .panel-head {
      height: 34px;
    }

    .result-detail-layout .panel.well .panel-body {
      padding: 8px;
    }

    .result-detail-layout .panel.well .chart {
      height: 44px;
    }

    .result-detail-layout .ai-panel {
      padding: 12px;
      font-size: var(--font-body);
      line-height: 1.42;
    }

    .result-detail-layout .ai-panel h3 {
      margin-bottom: 10px;
      font-size: var(--font-body);
    }

    .result-detail-layout .ai-analysis {
      gap: 10px;
    }

    .result-detail-layout .ai-item {
      grid-template-columns: 44px 1fr;
      gap: 8px;
      padding: 6px 0;
    }

    .loading-list {
      margin-top: 20px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .status-line {
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: var(--muted);
      font-size: var(--font-body);
    }

    .setup-card {
      min-height: 112px;
      display: grid;
      grid-template-columns: 42px 1fr auto;
      align-items: center;
      gap: 14px;
      padding: 16px;
      border: 1px solid #343434;
      background: #202020;
      border-radius: var(--radius);
    }

    .step-num {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      border-radius: var(--radius);
      background: var(--well);
      border: 1px solid var(--border);
      color: var(--muted);
      font-weight: 700;
    }

    .step-num.done {
      color: white;
      background: var(--accent);
      border-color: var(--accent-hover);
    }

    .chart {
      height: 110px;
      position: relative;
      background:
        linear-gradient(rgba(255,255,255,.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.04) 1px, transparent 1px),
        #171717;
      background-size: 34px 22px;
      border: 1px solid #333;
      border-radius: var(--radius);
      overflow: hidden;
    }

    .chart svg,
    .replay-map svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    .robot-preview {
      position: relative;
      height: 100%;
      min-height: 0;
      perspective: 900px;
      background:
        linear-gradient(rgba(255,255,255,.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.04) 1px, transparent 1px),
        #101010;
      background-size: 32px 32px;
      overflow: hidden;
    }

    .robot-3d {
      position: absolute;
      left: 50%;
      top: 51%;
      width: 360px;
      height: 260px;
      transform: translate(-50%, -50%) rotateX(58deg) rotateZ(-24deg);
      transform-style: preserve-3d;
      filter: drop-shadow(48px 44px 0 rgba(0,0,0,.22));
      background: none;
    }

    .robot-3d::before,
    .robot-3d::after {
      content: "";
      position: absolute;
      transform-style: preserve-3d;
    }

    .robot-3d .mesh-body {
      position: absolute;
      left: 92px;
      top: 58px;
      width: 178px;
      height: 118px;
      transform-style: preserve-3d;
      transform: translateZ(44px);
      background: linear-gradient(135deg, #f4f4f2 0 54%, #d8d8d5 55%);
      border: 2px solid #777;
      border-radius: 12px;
      box-shadow:
        inset -34px 0 0 #1677e6,
        inset 0 20px 0 #ffffff,
        0 0 0 1px rgba(255,255,255,.25);
    }

    .robot-3d .mesh-body::before {
      content: "";
      position: absolute;
      left: 34px;
      top: -62px;
      width: 102px;
      height: 76px;
      transform: skewX(-18deg);
      background: linear-gradient(145deg, #1d1f23, #33363b);
      border: 2px solid #777;
      border-radius: 10px;
      box-shadow: inset 0 -10px 0 rgba(0,0,0,.32);
    }

    .robot-3d .mesh-body::after {
      content: "";
      position: absolute;
      left: 78px;
      top: -86px;
      width: 34px;
      height: 22px;
      background: #30d5e8;
      border: 2px solid #ffffff;
      border-radius: 8px;
      box-shadow: 0 0 16px rgba(48,213,232,.5);
    }

    .robot-3d .mesh-face {
      position: absolute;
      left: 46px;
      top: 88px;
      width: 68px;
      height: 58px;
      transform: translateZ(70px) rotateZ(90deg);
      background: #101010;
      border: 2px solid #6b6b6b;
      border-radius: 10px;
      box-shadow: inset 0 -18px 0 #1e1e1e;
    }

    .robot-3d .mesh-face::before,
    .robot-3d .mesh-face::after {
      content: "";
      position: absolute;
      top: 15px;
      width: 15px;
      height: 21px;
      border-radius: 50%;
      background: #f2f2f2;
      box-shadow: inset 0 -7px 0 #1a1a1a;
    }

    .robot-3d .mesh-face::before { left: 15px; }
    .robot-3d .mesh-face::after { right: 15px; }

    .robot-3d .wheel {
      position: absolute;
      width: 52px;
      height: 52px;
      transform: translateZ(18px);
      border-radius: 50%;
      background: radial-gradient(circle, #0d0d0d 0 24%, #373737 25% 44%, #111 45% 100%);
      border: 3px solid #050505;
      box-shadow: inset 0 0 0 4px #2c2c2c;
    }

    .robot-3d .w1 { left: 72px; top: 54px; }
    .robot-3d .w2 { left: 72px; top: 154px; }
    .robot-3d .w3 { right: 72px; top: 54px; }
    .robot-3d .w4 { right: 72px; top: 154px; }

    .robot-3d .mesh-axis {
      position: absolute;
      left: 54px;
      right: 54px;
      top: 104px;
      height: 10px;
      transform: translateZ(15px);
      background: #121212;
      border-radius: 999px;
      box-shadow: 0 102px 0 #121212;
    }

    .sensor-cone {
      position: absolute;
      left: 54%;
      top: 42%;
      width: 310px;
      height: 130px;
      transform-origin: left center;
      transform: rotate(-8deg);
      background: conic-gradient(from -21deg at 0 50%, rgba(57,184,200,.32), rgba(57,184,200,.05) 42deg, transparent 43deg);
      clip-path: polygon(0 50%, 100% 0, 100% 100%);
    }

    .dimension-line {
      position: absolute;
      border-top: 2px solid var(--accent);
      color: var(--muted);
      font-size: var(--font-caption);
    }

    .replay-map {
      position: relative;
      height: auto;
      min-height: 0;
      background:
        linear-gradient(rgba(255,255,255,.045) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.045) 1px, transparent 1px),
        #101010;
      background-size: 34px 34px;
      overflow: hidden;
    }

    .timeline {
      height: 70px;
      gap: 12px;
      padding: 0 16px;
      background: #171717;
      border-top: 1px solid #303030;
    }

    .scrubber {
      flex: 1;
      height: 8px;
      position: relative;
      background: #383838;
      border-radius: 999px;
    }

    .scrubber .fill {
      width: 54%;
      height: 100%;
      background: var(--accent);
      border-radius: 999px;
    }

    .scrubber .tick {
      position: absolute;
      top: -5px;
      width: 2px;
      height: 18px;
      background: var(--warn);
    }

    .context-menu {
      width: 214px;
      padding: 6px;
      background: #121212;
      border: 1px solid #4a4a4a;
      border-radius: var(--radius);
      box-shadow: 0 16px 42px rgba(0,0,0,.45);
    }

    .menu-row {
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 10px;
      color: var(--muted);
      border-radius: 3px;
      font-size: var(--font-body);

    function pill(label, cls = "") {

      return `<div class="metric"><div class="label">${label}</div><div class="num" style="${color ? `color:${color}` : ""}">${num}</div><div class="delta">${delta}</div></div>`;

    function compactMetric(label, num, delta, color = "") {
